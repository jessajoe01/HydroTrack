<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Smart Water Guardian</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card" style="max-width:500px;">

    <div class="auth-logo">
      <div style="font-size:3rem;">💧</div>
      <h1>Create Account</h1>
      <p>Start managing your water supply today</p>
    </div>

    <div id="errorMsg" class="alert-banner danger" style="display:none;">
      <span class="alert-icon">⚠️</span>
      <span id="errorText"></span>
    </div>

    <div id="successMsg" class="alert-banner success" style="display:none;">
      <span class="alert-icon">✅</span>
      <span>Account created! Redirecting to login...</span>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat password" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="familySize">Family Size</label>
          <input type="number" id="familySize" placeholder="e.g. 4" min="1" max="20" required>
        </div>
        <div class="form-group">
          <label for="address">Area / Address</label>
          <input type="text" id="address" placeholder="e.g. Koramangala, Bangalore">
        </div>
      </div>

      <div class="alert-banner info mt-1 mb-1" style="font-size:0.82rem;">
        <span class="alert-icon">💡</span>
        <span>Family size helps us estimate your daily water usage automatically.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg mt-2" id="registerBtn">
        Create Account
      </button>
    </form>

    <p class="text-center text-muted mt-2">
      Already have an account?
      <a href="/login" style="color:var(--primary-mid);font-weight:600;">Sign in here</a>
    </p>

  </div>
</div>

<script src="/static/script.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn        = document.getElementById('registerBtn');
    const errorDiv   = document.getElementById('errorMsg');
    const errorTxt   = document.getElementById('errorText');
    const successDiv = document.getElementById('successMsg');

    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Client side validation
    if (password.length < 6) {
      errorTxt.textContent   = 'Password must be at least 6 characters.';
      errorDiv.style.display = 'flex';
      return;
    }

    if (password !== confirmPassword) {
      errorTxt.textContent   = 'Passwords do not match.';
      errorDiv.style.display = 'flex';
      return;
    }

    errorDiv.style.display = 'none';
    btn.textContent        = 'Creating account...';
    btn.disabled           = true;

    const data = await post('/register', {
      name:        document.getElementById('name').value,
      email:       document.getElementById('email').value,
      password:    password,
      family_size: parseInt(document.getElementById('familySize').value),
      address:     document.getElementById('address').value
    });

    if (data.status === 'success') {
      successDiv.style.display = 'flex';
      errorDiv.style.display   = 'none';
      setTimeout(() => window.location.href = '/login', 1800);
    } else {
      errorTxt.textContent   = data.error || 'Registration failed. Please try again.';
      errorDiv.style.display = 'flex';
      btn.textContent        = 'Create Account';
      btn.disabled           = false;
    }
  });
</script>

</body>
</html>
